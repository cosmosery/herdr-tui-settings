onboarding = false

[theme]
name = "nord"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
detach = "prefix+d"
reload_config = "prefix+r"
settings = "prefix+shift+s"
workspace_picker = ["prefix+w", "prefix+s"]
goto = "prefix+g"
rename_workspace = "prefix+$"
rename_tab = "prefix+,"
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
close_tab = "prefix+&"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
resize_mode = "prefix+shift+r"
copy_mode = ["prefix+v", "prefix+["]
last_pane = "prefix+;"
close_pane = "prefix+x"
zoom = "prefix+z"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "ctrl+k"
navigate_pane_down = "ctrl+j"

[ui]
accent = "#88c0d0"
mouse_capture = true
tab_bar_position = "top"
tab_bar_right = [{ type = "datetime", format = "%H:%M %d-%b-%y" }]
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
prompt_new_tab_name = false

[experimental]
switch_ascii_input_source_in_prefix = true
